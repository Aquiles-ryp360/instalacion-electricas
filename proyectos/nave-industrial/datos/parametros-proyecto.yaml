# Parametros del proyecto industrial
# ESTIMADO - VERIFICAR CON INGENIERO

proyecto: "Instalaciones electricas industriales - Nave industrial"
propietario: "por definir"

# Ubicacion
ubicacion:
  distrito: "por definir"
  provincia: "por definir"
  departamento: "Puno"
  direccion: "por definir"

# Datos electricos generales
tension_v: 380
fases: 3
frecuencia_hz: 60
factor_potencia: 0.85
factor_potencia_objetivo: 0.95
factor_diseno: 1.25
resistividad_rho: 0.0175

# Caidas de tension (CNE)
caida_alimentador_porc: 2.0
caida_derivados_porc: 2.5
caida_total_max_porc: 4.0

# Datos de suministro
potencia_solicitada_kw: 70
tipo_conexion: "trifasica"
nivel_tension: "380/220V"
sistema_distribucion: "TN-S"

# Areas
area_terreno_m2: 500
area_construida_m2: 450
area_techada_m2: 450

# Alimentador principal
longitud_alimentador_m: 15

# Subestacion
subestacion_propia: false
transformador_kva: null
tipo_subestacion: null

# Nave
nave:
  largo_m: 30
  ancho_m: 15
  altura_m: 6
  zonas:
    - nombre: Produccion
      area_m2: 216
      iluminacion_tipo: LED industrial 100W
      iluminacion_nivel_lux: 300
    - nombre: Almacen
      area_m2: 120
      iluminacion_tipo: LED industrial 80W
      iluminacion_nivel_lux: 150
    - nombre: Oficinas
      area_m2: 36
      iluminacion_tipo: LED panel 60x60
      iluminacion_nivel_lux: 500
    - nombre: SS.HH.
      area_m2: 8
      iluminacion_tipo: LED
      iluminacion_nivel_lux: 100

# Conductores
conductor_tipo: THW-90
conductor_material: cobre
temperatura_ambiente_c: 40
numero_conductores_tubo: 4

# Compensacion FP
compensacion_fp:
  requiere: true
  tipo: automatica
  banco_kvar: 0
