schema_version: 1
project_id: unidad-2-industrial
status: criterio_academico_calculado_pendiente_fotometria_ies
method: lumen_method

rules:
  formula: "E = N * flujo_luminaria * CU * FM / area"
  maintenance_factor_default: 0.80
  source_interior: "RNE EM.010, articulo 3, tabla de iluminancias para ambientes al interior"
  exterior_note: "la EM.010 no fija en su tabla interior un valor especifico para playa/marquesina; se adoptan objetivos de ingenieria y se exige simulacion fotometrica"

